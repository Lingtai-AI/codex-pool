[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subs-pool"
dynamic = ["version"]
description = "General-purpose subscription pool with an initial Codex module."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "filelock>=3.13",
    "textual>=8.2.8,<9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "openai>=1.0",
    "twine>=5.0",
]

[project.scripts]
subspool = "subs_pool.cli:main"
subspool-cli = "subs_pool.agent_cli:main"

[project.urls]
Repository = "https://github.com/Lingtai-AI/subs-pool"

[tool.hatch.version]
path = "src/subs_pool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/subs_pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
