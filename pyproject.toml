[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-pool"
version = "0.1.0"
description = "Standalone account pool + local Responses API proxy for Codex subscriptions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "filelock>=3.13",
    "textual>=8.2.8,<9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "openai>=1.0",
]

[project.scripts]
codex-pool = "codex_pool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
